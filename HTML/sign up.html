        <div class="col-md-6">
            <div class="glass_panel p-4">
                <h3 class="text-center mb-4">Create Account</h3>
                
                <form id="signupForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter name">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter email">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Password">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block mt-4">Sign Up</button>
                </form>

</div>
  <script src="../js/jquery.min.js"></script>

 <script>
 $(document).ready(function () {
    $('#signupForm').submit(function (e) {
        // Stop the form from submitting normally
        e.preventDefault(); 
        
        // Get the values from the input fields
        var name = $('#username').val();
        var email = $('#email').val();
        var password = $('#password').val();
        var confirmPassword = $('#confirmPassword').val();
        
        // Validation Logic
        if (name === "" || email === "" || password === "") {
            // Check if anything is left blank
            Swal.fire('Error', 'Please fill in all fields!', 'error');
            
        } else if (password.length < 6) {
            // Check password length
            Swal.fire('Error', 'Password must be at least 6 characters.', 'error');
            
        } else if (password !== confirmPassword) {
            // Check if passwords match
            Swal.fire('Error', 'Passwords do not match!', 'error');
            
        } else {
            // If everything is correct, show success alert
            Swal.fire('Success!', 'Your account has been created.', 'success');
            
            // Clear the form fields
            $('#signupForm')[0].reset();
        }
    });
});
    </script>
